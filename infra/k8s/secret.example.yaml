# Copy this file to secret.yaml, replace every value, then apply secret.yaml.
# Do not commit secret.yaml or place production credentials in a ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: meeting-insights-agent-secrets
  labels:
    app.kubernetes.io/name: meeting-insights-agent
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # Required by the speech, vision, and report-specialist tools.
  GROQ_API_KEY: REPLACE_WITH_GROQ_API_KEY
  # Use this for the direct Anthropic API path. Omit it when the runtime uses
  # a workload identity to authenticate to a cloud model provider instead.
  ANTHROPIC_API_KEY: REPLACE_WITH_ANTHROPIC_API_KEY
