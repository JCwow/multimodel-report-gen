apiVersion: apps/v1
kind: Deployment
metadata:
  name: meeting-insights-agent
  labels:
    app.kubernetes.io/name: meeting-insights-agent
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: meeting-insights-agent
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meeting-insights-agent
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: meeting-insights-agent
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replace with a pinned Artifact Registry or other trusted image digest.
          image: meeting-insights-agent:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: meeting-insights-agent-config
            - secretRef:
                name: meeting-insights-agent-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: sandbox
              mountPath: /tmp/sandbox
      volumes:
        - name: sandbox
          emptyDir:
            sizeLimit: 256Mi
