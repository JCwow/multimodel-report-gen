# Local-kind override. Apply this after configmap.yaml when running a
# Kubernetes-in-Docker demo on a platform where Claude Agent SDK cannot load.
# It intentionally leaves the production/GKE default in configmap.yaml alone.
apiVersion: v1
kind: ConfigMap
metadata:
  name: meeting-insights-agent-config
  labels:
    app.kubernetes.io/name: meeting-insights-agent
    app.kubernetes.io/component: api
data:
  AGENT_BACKEND: "pipeline"
  AGENT_MAX_TURNS: "12"
  AGENT_MAX_BUDGET_USD: "0.50"
  MCP_TRANSPORT: "sdk"
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  SANDBOX_ROOT: "/tmp/sandbox"
  TOOL_TIMEOUT_SEC: "120"
  MAX_FILE_BYTES: "26214400"
